[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlayer-claude-plugins"
version = "1.0.0"
description = "Development metadata and test tooling for PromptLayer Claude Code plugins."
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
